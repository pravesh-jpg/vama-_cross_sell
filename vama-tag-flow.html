<title>VAMA Tag Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-elev:#FFFFFF;
    --bg-sunk:#F6F8FB;
    --border:#DCE3EC;
    --border-soft:#E8EDF3;
    --text:#16213A;
    --text-dim:#3D5170;
    --text-faint:#7B8CA6;
    --accent:#1F4E8C;
    --accent-2:#1F4E8C;
    --accent-ink:#1B3A63;
    --accent-soft:#EAF1FA;
    --line:#DCE3EC;
    --gradient:linear-gradient(120deg,#1F4E8C 0%,#3D7EC4 100%);

    --tag-chadhava:#16213A;
    --tag-puja:#16213A;
    --tag-astro:#16213A;
    --tag-ecome:#16213A;
    --tag-chadhavaplus:#16213A;
    --tag-kundli:#16213A;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{
    margin:0;
    background:#FFFFFF;
    color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:0 16px 80px;
    -webkit-font-smoothing:antialiased;
  }
  .masthead{
    height:4px;
    background:var(--gradient);
    margin:0 -16px 32px;
  }
  @media (min-width:1112px){ .masthead{ border-radius:0 0 6px 6px; } }
  .num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}

  .wrap{max-width:1500px;margin:0 auto;}

  header.page{margin-bottom:36px;}
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent-ink);
    background:var(--accent-soft);
    display:inline-block;
    padding:4px 10px;
    border-radius:4px;
    margin-bottom:14px;
  }
  h1{
    font-size:clamp(24px,3.4vw,34px);
    line-height:1.18;
    margin:0 0 22px;
    font-weight:700;
    letter-spacing:-.01em;
    text-wrap:balance;
    max-width:24ch;
  }
  .sub{
    color:var(--text-dim);
    font-size:15px;
    max-width:64ch;
    line-height:1.55;
    margin:0 0 16px;
  }
  details.methodology{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:10px;
    padding:2px 16px;
    font-size:13.5px;
    color:var(--text-dim);
  }
  details.methodology summary{
    cursor:pointer;
    padding:12px 0;
    font-weight:600;
    color:var(--text);
    list-style:none;
  }
  details.methodology summary::-webkit-details-marker{display:none;}
  details.methodology summary::before{
    content:"▸ ";
    color:var(--accent);
    font-family:"IBM Plex Mono",monospace;
  }
  details.methodology[open] summary::before{content:"▾ ";}
  details.methodology .body{padding:0 0 16px;line-height:1.7;}
  details.methodology .body p{margin:0 0 8px;}
  details.methodology .body b{color:var(--text);font-weight:600;}
  details.methodology .body code{
    font-family:"IBM Plex Mono",monospace;
    background:var(--bg-sunk);
    padding:1px 5px;
    border-radius:3px;
    font-size:12.5px;
  }

  section{margin-top:40px;}
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .section-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .section-note{font-size:13px;color:var(--text-faint);}

  /* platform KPI row */
  .kpi-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:12px 12px 0 0;
    overflow:hidden;
  }
  .kpi{
    background:var(--bg-elev);
    padding:20px 28px;
    min-width:0;
  }
  .kpi .label{font-size:12px;color:var(--text-dim);margin-bottom:8px;font-weight:500;}
  .kpi .value{font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi.hero{
    background:var(--bg-elev);
    position:relative;
  }
  .kpi.hero .label{color:var(--text);}
  .kpi.hero .value{color:var(--accent-ink);font-size:18px;white-space:normal;overflow:visible;text-overflow:clip;}
  .kpi .value.row-toggle{cursor:pointer;}
  .kpi .value.row-toggle .chev{font-size:14px;vertical-align:middle;}

  .platform-users-detail{
    background:var(--bg-sunk);
    border:1px solid var(--border);
    border-top:none;
    padding:14px 28px 16px;
  }
  .platform-users-detail table.flow-table{min-width:620px;}

  details.all-tags{
    margin-top:1px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 12px 12px;
  }
  details.all-tags summary{
    cursor:pointer;
    padding:12px 28px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    list-style:none;
    display:flex;
    align-items:center;
    gap:7px;
  }
  details.all-tags summary::-webkit-details-marker{display:none;}
  details.all-tags summary .chev{
    font-family:"IBM Plex Mono",monospace;
    color:var(--accent);
    transition:transform .15s ease;
  }
  details.all-tags[open] summary .chev{transform:rotate(90deg);}
  details.all-tags .all-tags-body{
    padding:2px 28px 16px;
    border-top:1px solid var(--border-soft);
    overflow-x:auto;
  }
  details.all-tags table.flow-table{min-width:620px;}
  details.all-tags table.flow-table .dest{font-weight:600;}

  /* tree connector */
  .tree-stem{
    width:1px;height:28px;
    background:var(--line);
    margin:0 auto;
  }
  .tree-bar-wrap{max-width:1080px;margin:0 auto;padding:0 2px;}
  .tree-bar{height:1px;background:var(--line);position:relative;}

  .tag-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:0;
  }
  .tag-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-top:3px solid var(--tag-c);
    border-radius:12px;
    padding:18px 18px 8px;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 14px 28px -20px color-mix(in srgb, var(--tag-c) 70%, transparent);
  }
  .tag-card::before{
    content:"";
    position:absolute;
    top:-29px;left:50%;
    width:1px;height:29px;
    background:var(--line);
  }
  .tag-card .head{
    display:flex;align-items:center;gap:8px;margin-bottom:14px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--tag-c);flex:none;}
  .tag-card h3{margin:0;font-size:16.5px;font-weight:600;}
  .tag-card .cohort-note{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-weight:500;}

  .hero-stat .value{font-size:27px;font-weight:700;letter-spacing:-.01em;color:var(--tag-c);}
  .hero-stat .label{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .hero-stat{margin-bottom:14px;}

  .mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 14px;
    padding:12px 0;
    border-top:1px solid var(--border-soft);
    font-size:13px;
  }
  .mini-grid .mlabel{color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .mini-grid .mvalue{font-weight:600;font-size:14px;margin-top:1px;}

  details.flow{
    margin:6px -18px 0;
    border-top:1px solid var(--border-soft);
  }
  details.flow summary{
    cursor:pointer;
    padding:11px 18px;
    font-size:12.5px;
    font-weight:600;
    color:var(--accent-ink);
    list-style:none;
    display:flex;
    align-items:center;
    gap:6px;
  }
  details.flow summary::-webkit-details-marker{display:none;}
  details.flow summary .chev{
    font-family:"IBM Plex Mono",monospace;
    transition:transform .15s ease;
    color:var(--accent);
  }
  details.flow[open] summary .chev{transform:rotate(90deg);}
  details.flow .flow-body{padding:0 18px 16px;}

  table.flow-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.flow-table thead tr{background:#E7EFF9;}
  table.flow-table th{
    text-align:left;
    font-weight:600;
    color:var(--text-dim);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:8px 10px;
    border-bottom:1px solid var(--border-soft);
  }
  table.flow-table th.num-col, table.flow-table td.num-col{text-align:right;}
  table.flow-table td{padding:7px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  table.flow-table tbody tr:nth-child(even):not(.self-row){background:#F5F8FC;}
  table.flow-table tr:last-child td{border-bottom:none;}
  table.flow-table tr.self-row{background:#DCE9FA;}
  table.flow-table tr.self-row td:first-child{border-radius:6px 0 0 6px;}
  table.flow-table tr.self-row td:last-child{border-radius:0 6px 6px 0;}
  table.flow-table .dest{display:flex;align-items:center;gap:6px;font-weight:500;}
  table.flow-table .pct-bar{
    height:4px;border-radius:2px;background:#F2F2F2;
    overflow:hidden;margin-top:4px;width:64px;
  }
  table.flow-table .pct-bar > span{display:block;height:100%;background:var(--tag-c-row);}
  table.flow-table .pct-num{font-size:11px;color:var(--text-faint);}

  .row-toggle{
    background:none;border:none;padding:0;margin:0;
    display:flex;align-items:center;gap:7px;
    font:inherit;font-weight:600;color:var(--text);
    cursor:pointer;
  }
  .row-toggle.num-toggle{
    justify-content:flex-end;width:100%;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    font-variant-numeric:tabular-nums;font-weight:500;
  }
  .row-toggle .chev{
    font-family:"IBM Plex Mono",monospace;
    color:var(--accent);font-size:11px;
    transition:transform .15s ease;
    flex:none;
  }
  .row-toggle.open .chev{transform:rotate(90deg);}
  tr.detail-row td{padding:0;border-bottom:1px solid var(--border-soft);}
  tr.detail-row .crosssell{
    background:var(--bg-sunk);
    padding:14px 18px 16px;
    margin:0 -18px;
    overflow-x:auto;
  }
  .crosssell-label{
    font-size:11px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.04em;
    margin-bottom:8px;font-weight:600;
  }
  tr.detail-row table.flow-table, .platform-users-detail table.flow-table{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:8px;padding:2px 14px;}
  tr.detail-row table.flow-table th, .platform-users-detail table.flow-table th{padding-top:10px;}
  tr.detail-row table.flow-table td, tr.detail-row table.flow-table th,
  .platform-users-detail table.flow-table td, .platform-users-detail table.flow-table th{padding-left:14px;padding-right:14px;}

  footer{
    margin-top:48px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-faint);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (max-width:760px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .tag-grid{grid-template-columns:1fr;}
    .tag-card::before{display:none;}
  }
  @media (min-width:761px) and (max-width:980px){
    .tag-grid{grid-template-columns:repeat(2,1fr);}
  }

  .login-gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-gate[hidden]{display:none;}
  .login-box{
    width:100%;
    max-width:340px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 28px 28px;
    box-shadow:0 20px 40px -24px rgba(22,33,58,.18);
  }
  .login-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:4px;}
  .login-sub{font-size:13px;color:var(--text-faint);margin-bottom:22px;}
  .login-label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
  .login-input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    color:var(--text);
    background:#FFFFFF;
  }
  .login-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .login-error{font-size:12.5px;color:#B3261E;margin-top:12px;}
  .login-submit{
    width:100%;
    margin-top:22px;
    padding:11px;
    border:none;
    border-radius:8px;
    background:var(--accent-ink);
    color:#FFFFFF;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .login-submit:hover{background:var(--accent);}
</style>

<div id="login-gate" class="login-gate">
  <form class="login-box" id="login-form">
    <div class="login-title">Vama Paying Users</div>
    <div class="login-sub">Sign in to view this dashboard</div>
    <label class="login-label" for="login-user">Username</label>
    <input class="login-input" type="text" id="login-user" autocomplete="username" autofocus>
    <label class="login-label" for="login-pass">Password</label>
    <input class="login-input" type="password" id="login-pass" autocomplete="current-password">
    <div class="login-error" id="login-error" hidden>Incorrect username or password</div>
    <button class="login-submit" type="submit">Sign in</button>
  </form>
</div>

<div id="main-content" hidden>
<div class="masthead"></div>
<div class="wrap">
  <section style="margin-top:26px;">
    <div class="section-head">
      <span class="section-title">Vama Paying Users</span>
    </div>
    <div class="kpi-row" id="platform-kpis"></div>
    <div class="platform-users-detail" id="platform-users-spread" hidden></div>

    <details class="all-tags">
      <summary><span class="chev">&#9656;</span> Break platform totals down by service</summary>
      <div class="all-tags-body">
        <table class="flow-table" id="all-tags-table">
          <thead><tr>
            <th>Service</th>
            <th class="num-col">Cohort users</th>
            <th class="num-col">Transactions</th>
            <th class="num-col">Revenue</th>
            <th class="num-col">AOV</th>
            <th class="num-col">ARPU</th>
          </tr></thead>
          <tbody id="all-tags-rows"></tbody>
        </table>
      </div>
    </details>
  </section>

</div>
</div>

const TAG_KEY = {
  "Chadhava":"chadhava", "Puja":"puja", "Astro":"astro",
  "Ecome":"ecome", "Chadhava+":"chadhavaplus", "Kundli":"kundli"
};

function fmtNum(n){ return Math.round(n).toLocaleString('en-IN'); }
function fmtINR(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtPct(n){ return n.toFixed(1) + '%'; }

function kpiTile(label, value, hero){
  const el = document.createElement('div');
  el.className = 'kpi' + (hero ? ' hero' : '');
  el.innerHTML = `<div class="label">${label}</div><div class="value num">${value}</div>`;
  return el;
}

function platformUsersSpreadTable(){
  const spread = DATA.platform_txn_spread;
  const buckets = ["1","2","3","4","5+"];
  const totalUsers = buckets.reduce((s,b) => s + spread[b].users, 0);
  let rows = '';
  buckets.forEach(b => {
    const c = spread[b];
    const pct = totalUsers ? (c.users / totalUsers * 100) : 0;
    rows += `<tr>
      <td><div class="dest">Tx Count ${b}</div></td>
      <td class="num-col num">${fmtNum(c.users)}</td>
      <td class="num-col num pct-num">${fmtPct(pct)}</td>
      <td class="num-col num">${fmtNum(c.txns)}</td>
      <td class="num-col num">${fmtINR(c.revenue)}</td>
      <td class="num-col num">${fmtINR(c.aov)}</td>
      <td class="num-col num">${fmtINR(c.arpu)}</td>
    </tr>`;
  });

  return `<table class="flow-table">
    <thead><tr>
      <th>Tx Count</th>
      <th class="num-col">Users</th>
      <th class="num-col">% of users</th>
      <th class="num-col">Transactions</th>
      <th class="num-col">Revenue</th>
      <th class="num-col">AOV</th>
      <th class="num-col">ARPU</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function buildPlatform(){
  const p = DATA.platform;
  const row = document.getElementById('platform-kpis');
  const usersTile = kpiTile('Unique paid users', '');
  const valueEl = usersTile.querySelector('.value');
  valueEl.classList.add('row-toggle');
  valueEl.innerHTML = `${fmtNum(p.users)} <span class="chev">&#9656;</span>`;
  valueEl.addEventListener('click', () => {
    const detail = document.getElementById('platform-users-spread');
    const isOpen = !detail.hidden;
    if (!isOpen && !detail.innerHTML){
      detail.innerHTML = platformUsersSpreadTable();
    }
    detail.hidden = isOpen;
    valueEl.classList.toggle('open', !isOpen);
  });
  row.appendChild(usersTile);
  row.appendChild(kpiTile('Transactions', fmtNum(p.txns)));
  row.appendChild(kpiTile('Revenue', fmtINR(p.revenue), true));
  row.appendChild(kpiTile('AOV', fmtINR(p.aov)));
  row.appendChild(kpiTile('ARPU', fmtINR(p.arpu)));
}

function spreadSubTable(sourceTag, destTag, cellUsers){
  const spread = DATA.txn_spread_full[sourceTag][destTag];
  const buckets = ["1","2","3","4","5+"];
  let spreadRows = '';
  buckets.forEach(b => {
    const c = spread[b];
    const pct = cellUsers ? (c.users / cellUsers * 100) : 0;
    spreadRows += `<tr>
      <td><div class="dest">Tx Count ${b}</div></td>
      <td class="num-col num">${fmtNum(c.users)}</td>
      <td class="num-col num pct-num">${fmtPct(pct)}</td>
      <td class="num-col num">${fmtNum(c.txns)}</td>
      <td class="num-col num">${fmtINR(c.revenue)}</td>
      <td class="num-col num">${fmtINR(c.aov)}</td>
      <td class="num-col num">${fmtINR(c.arpu)}</td>
    </tr>`;
  });

  return `<table class="flow-table">
    <thead><tr>
      <th>Tx Count</th>
      <th class="num-col">Users</th>
      <th class="num-col">% of these users</th>
      <th class="num-col">Transactions</th>
      <th class="num-col">Revenue</th>
      <th class="num-col">AOV</th>
      <th class="num-col">ARPU</th>
    </tr></thead>
    <tbody>${spreadRows}</tbody>
  </table>`;
}

function crossSellTable(sourceTag){
  const cohortSize = DATA.cohort_sizes[sourceTag];
  const row = DATA.matrix[sourceTag];
  const srcKey = TAG_KEY[sourceTag];
  const dests = DATA.order.slice();

  let rows = '';
  dests.forEach(d => {
    const isSelf = d === sourceTag;
    const cell = isSelf ? DATA.exclusive[sourceTag] : row[d];
    const pct = cohortSize ? (cell.users / cohortSize * 100) : 0;
    const destKey = TAG_KEY[d];
    rows += `<tr class="${isSelf ? 'self-row' : ''}">
      <td>
        <button class="row-toggle" data-src="${sourceTag}" data-dest="${d}">
          <span class="chev">&#9656;</span> ${d}${isSelf ? ' <span class="pct-num">(stayed, never crossed)</span>' : ''}
        </button>
      </td>
      <td class="num-col num">${fmtNum(cell.users)}</td>
      <td class="num-col num pct-num">${fmtPct(pct)}</td>
      <td class="num-col num">${fmtNum(cell.txns)}</td>
      <td class="num-col num">${fmtINR(cell.revenue)}</td>
      <td class="num-col num">${fmtINR(cell.txns ? cell.revenue/cell.txns : 0)}</td>
      <td class="num-col num">${fmtINR(cell.users ? cell.revenue/cell.users : 0)}</td>
    </tr>
    <tr class="detail-row spread-row" id="spread-${srcKey}-${destKey}" hidden>
      <td colspan="7"><div class="crosssell">${spreadSubTable(sourceTag, d, cell.users)}</div></td>
    </tr>`;
  });

  return `<table class="flow-table">
    <thead><tr>
      <th>Service</th>
      <th class="num-col">Users</th>
      <th class="num-col">% of cohort</th>
      <th class="num-col">Transactions</th>
      <th class="num-col">Revenue</th>
      <th class="num-col">AOV</th>
      <th class="num-col">ARPU</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function buildAllTagsTable(){
  const body = document.getElementById('all-tags-rows');
  let rows = '';
  DATA.order.forEach(tag => {
    const key = TAG_KEY[tag];
    const cohort = DATA.cohort_sizes[tag];
    const tot = DATA.tag_totals[tag];
    rows += `<tr>
      <td>
        <button class="row-toggle" data-tag="${tag}">
          <span class="chev">&#9656;</span> ${tag}
        </button>
      </td>
      <td class="num-col num">
        <button class="row-toggle num-toggle" data-platform-tag="${tag}">
          ${fmtNum(cohort)} <span class="chev">&#9656;</span>
        </button>
      </td>
      <td class="num-col num">${fmtNum(tot.txns)}</td>
      <td class="num-col num">${fmtINR(tot.revenue)}</td>
      <td class="num-col num">${fmtINR(tot.aov)}</td>
      <td class="num-col num">${fmtINR(tot.arpu)}</td>
    </tr>
    <tr class="detail-row" id="platform-spread-${key}" hidden>
      <td colspan="6"><div class="crosssell">${spreadSubTable(tag, tag, cohort)}</div></td>
    </tr>
    <tr class="detail-row" id="detail-${key}" hidden>
      <td colspan="6"><div class="crosssell">${crossSellTable(tag)}</div></td>
    </tr>`;
  });
  body.innerHTML = rows;

  body.querySelectorAll('.row-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      let detail;
      if (btn.dataset.platformTag){
        detail = document.getElementById('platform-spread-' + TAG_KEY[btn.dataset.platformTag]);
      } else if (btn.dataset.tag){
        detail = document.getElementById('detail-' + TAG_KEY[btn.dataset.tag]);
      } else {
        detail = document.getElementById('spread-' + TAG_KEY[btn.dataset.src] + '-' + TAG_KEY[btn.dataset.dest]);
      }
      const isOpen = !detail.hidden;
      detail.hidden = isOpen;
      btn.classList.toggle('open', !isOpen);
    });
  });
}

buildPlatform();
buildAllTagsTable();

      try{ sessionStorage.setItem('vama-dash-auth', '1'); }catch(e){}
